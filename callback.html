<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתחבר ל-Google Drive...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    direction: rtl;
  }
  .container{
    text-align: center;
    padding: 40px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .spinner{
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }
  h1{
    font-size: 24px;
    font-weight: 300;
    margin: 20px 0 10px;
  }
  p{
    font-size: 14px;
    opacity: 0.9;
    margin: 10px 0;
  }
  .status{
    font-size: 12px;
    margin-top: 20px;
    opacity: 0.7;
  }
  .check{
    display: none;
    margin: 20px auto;
    width: 64px;
    height: 64px;
    background: rgba(16,185,129,.2);
    border-radius: 50%;
    align-items: center;
    justify-content: center;
  }
  .check.show{
    display: flex;
    animation: checkPop 0.3s ease-out;
  }
  @keyframes checkPop{
    from{ transform: scale(0); }
    to{ transform: scale(1); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="spinner" id="spinner"></div>
  <div class="check" id="check">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
  </div>
  <h1 id="title">מתחבר ל-Google Drive...</h1>
  <p id="subtitle">אנא המתן רגע</p>
  <div class="status" id="status"></div>
</div>

<script>
// Firebase Realtime Database URL
const FB_URL = 'https://moneytime-app-f5a15-default-rtdb.firebaseio.com';

// דף זה מתארח בנפרד מהאפליקציה (ריפו ציבורי moneytime-static) — אין index.html
// לחזור אליו שם. הצמדה ל-index.html רלוונטית רק בפיתוח מקומי (npx serve .).
var STANDALONE = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';

// המקורות היחידים שמותר להם לקבל את הטוקן ב-postMessage: ה-PWA בפרודקשן, והמקור של
// הדף עצמו (בפיתוח מקומי האפליקציה וה-callback חולקים את אותו localhost).
// יעד '*' היה מוסר את הטוקן לכל דף שפתח את החלון הזה.
var ALLOWED_OPENERS = ['https://moneytime.pages.dev'];
if(ALLOWED_OPENERS.indexOf(window.location.origin) === -1) ALLOWED_OPENERS.push(window.location.origin);

// חילוץ token ו-state מה-URL
var hash = window.location.hash || window.location.search;
var params = new URLSearchParams(hash.replace(/^[#?]/, ''));
var token = params.get('access_token');
// state חובה: בלעדיו הטוקן היה נכתב לצומת משותף וקריא לכל (oauthTokens/anon),
// והאפליקציה ממילא דוחה טוקן שה-state שלו לא תואם לזה שהיא שמרה.
var state = params.get('state') || '';

function updateStatus(msg){
  document.getElementById('status').textContent = msg;
}

function showSuccess(){
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('check').classList.add('show');
  document.getElementById('title').textContent = 'מחובר בהצלחה!';
  document.getElementById('subtitle').textContent = 'חוזר לאפליקציה...';
}

var hasOpener = !!(window.opener && !window.opener.closed);

if(token && state && hasOpener){
  // PWA popup: הטוקן עובר רק לחלון האב, ורק אם הוא אחד המקורות המותרים
  // (postMessage ליעד שלא תואם פשוט לא נמסר). לא נכתב ל-Firebase ולא ל-deep link —
  // אין שם מי שיאסוף אותו, והוא היה נשאר חשוף.
  try{
    ALLOWED_OPENERS.forEach(function(origin){
      window.opener.postMessage({ type: 'oauth_token', token: token, state: state }, origin);
    });
    updateStatus('✓ נשלח לאפליקציה');
    showSuccess();
    setTimeout(function(){ window.close(); }, 1500);
  }catch(e){
    updateStatus('⚠ שגיאה בהעברה לאפליקציה: ' + e.message);
  }

} else if(token && state){
  updateStatus('שומר את פרטי ההתחברות...');

  // 1. localStorage — רק בפיתוח מקומי, שם האפליקציה באותו מקור וקוראת אותו אחרי
  // ה-redirect. בפרודקשן הדף הזה על מקור אחר (github.io), האפליקציה לא יכולה לקרוא
  // משם, והטוקן היה נשאר שמור שם לתמיד.
  if(!STANDALONE){
    try{
      localStorage.setItem('gtoken', token);
      localStorage.setItem('syen', '1');
      localStorage.setItem('oauth_done', '1');
    }catch(e){
      updateStatus('⚠ שגיאה ב-localStorage: ' + e.message);
    }
  }

  // 2. שמירה ב-Firebase (עבור APK polling). האפליקציה מוחקת את הצומת מיד כשהיא אוספת.
  var safeState = state.replace(/[.#$\[\]\/]/g, '_');
  fetch(FB_URL + '/oauthTokens/' + safeState + '.json', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      token: token,
      state: state,
      ts: Date.now(),
      // האפליקציה דוחה טוקן שעבר את התוקף הזה
      expires: Date.now() + 600000
    })
  }).then(function(){
    updateStatus('✓ נשמר ב-Firebase');
  }).catch(function(e){
    updateStatus('⚠ שגיאה ב-Firebase: ' + e.message);
  });

  // 3. deep link ל-APK (גיבוי ל-polling). ה-state מצורף כדי שהאפליקציה תאמת שזה
  // הטוקן של הזרימה שהיא פתחה, ולא קישור שמישהו אחר שלח.
  var deepLink = 'com.tzur669.moneytime://oauth#access_token=' + encodeURIComponent(token)
    + '&state=' + encodeURIComponent(state);
  setTimeout(function(){
    try{
      window.location.href = deepLink;
      updateStatus('✓ ניסיון deep link ל-APK');
    }catch(e){
      // deep link נכשל - זה בסדר, זה אומר שאנחנו לא ב-APK
    }
  }, 500);

  fallbackRedirect();

} else {
  // אין token או state - שגיאה או ביטול
  document.getElementById('title').textContent = 'ההתחברות נכשלה';
  document.getElementById('subtitle').textContent = 'לא התקבל access token';
  document.getElementById('spinner').style.display = 'none';
  updateStatus('⚠ יש לנסות שוב או לבדוק הרשאות');

  setTimeout(function(){
    if(window.opener && !window.opener.closed){
      window.close();
    } else if(!STANDALONE){
      window.location.href = 'index.html';
    }
  }, 3000);
}

// fallback - חזרה לדף הראשי
function fallbackRedirect(){
  showSuccess();
  if(STANDALONE){
    document.getElementById('subtitle').textContent = 'אפשר לסגור את החלון ולחזור לאפליקציה';
    return;
  }
  setTimeout(function(){
    window.location.href = 'index.html';
  }, 1500);
}
</script>
</body>
</html>
